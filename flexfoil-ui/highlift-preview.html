<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>High-Lift Design Tool</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; font: 13px/1.4 system-ui, sans-serif; background: #14141c; color: #e6e6ef; }
      .wrap { display: flex; gap: 16px; padding: 16px; align-items: flex-start; flex-wrap: wrap; }
      .canvas-box { flex: 1 1 560px; min-width: 360px; }
      canvas { width: 100%; height: 360px; background: #fff; border-radius: 6px; display: block; }
      .controls { flex: 0 0 300px; display: flex; flex-direction: column; gap: 14px; }
      fieldset { border: 1px solid #2a2a38; border-radius: 6px; padding: 10px 12px; margin: 0; }
      legend { color: #b9b9c8; font-weight: 600; font-size: 11px; padding: 0 4px; }
      .row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
      .row label { flex: 0 0 96px; color: #9a9aab; }
      .row input[type="range"] { flex: 1; }
      .row .val { flex: 0 0 46px; text-align: right; font-variant-numeric: tabular-nums; }
      .row input[type="text"] { flex: 1; background: #1d1d2a; border: 1px solid #34344a; color: #e6e6ef; border-radius: 4px; padding: 3px 6px; }
      .presets { display: flex; gap: 6px; margin-bottom: 8px; }
      .presets button { flex: 1; background: #24243a; color: #e6e6ef; border: 1px solid #3a3a55; border-radius: 4px; padding: 5px; cursor: pointer; }
      .presets button:hover { background: #2f2f4d; }
      .note { color: #d9a441; font-size: 12px; margin: 0 16px 8px; }
      .plots { display: flex; gap: 14px; flex-wrap: wrap; padding: 0 16px 16px; }
      .plot-window { flex: 1 1 420px; min-width: 320px; display: flex; flex-direction: column; gap: 8px; }
      .plot-controls { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
      .plot-controls .row { margin: 0; min-width: 150px; }
      .plot-controls .row label { flex: 0 0 64px; }
      .plot-controls button { background: #2f5fbf; color: #fff; border: none; border-radius: 4px; padding: 6px 12px; cursor: pointer; }
      .plot-controls button:hover { background: #3a6fd6; }
      .plot { height: 340px; background: #fff; border-radius: 6px; transition: opacity 0.15s; }
      .plot.busy { opacity: 0.4; pointer-events: none; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="canvas-box"><canvas id="view"></canvas></div>
      <div class="controls" id="controls"></div>
    </div>
    <p class="note">Coupled inviscid multi-element — element interaction is modelled. Viscous drag (and Re / Ncrit) return in the next phase, so the polar shows Cl vs α for now.</p>
    <div class="plots">
      <div class="plot-window">
        <div class="plot-controls" id="polar-controls"></div>
        <div id="polar" class="plot"></div>
      </div>
      <div class="plot-window">
        <div class="plot-controls" id="cp-controls"></div>
        <div id="cp" class="plot"></div>
      </div>
    </div>
    <script type="module" src="/src/highlift/preview.ts"></script>
  </body>
</html>
